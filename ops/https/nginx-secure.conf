map $http_upgrade $claudechat_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=claudechat_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=claudechat_pairing:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __CLAUDECHAT_PUBLIC_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/claudechat-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __CLAUDECHAT_PUBLIC_HOST__;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/__CLAUDECHAT_PUBLIC_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CLAUDECHAT_PUBLIC_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ClaudeChatTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /v1/pairing/exchange {
        limit_req zone=claudechat_pairing burst=3 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:43110;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location / {
        limit_req zone=claudechat_api burst=40 nodelay;
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $claudechat_connection_upgrade;
        proxy_pass http://127.0.0.1:43110;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
